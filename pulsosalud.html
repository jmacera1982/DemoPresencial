<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulso Salud · Pantalla de Recepción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
 * Copia autocontenida de la Pantalla de Recepción (frontend), para
 * compartir con el cliente. Mismas pantallas, textos, reglas y tiempos que la
 * página real; lo único simulado es la respuesta de debQ (código de turno,
 * fecha y tiempo de espera) y el login (acepta cualquier usuario y contraseña).
 * Valores de estilo copiados de frontend/src/index.css y tailwind.config.js.
 */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body {
  background: #ffffff;
  font-family: Ubuntu, system-ui, "Segoe UI", sans-serif;
  color: #7d858c;
  -webkit-user-select: none;
  user-select: none;
}
button { font-family: inherit; -webkit-tap-highlight-color: transparent; }

.kiosk { max-width: 900px; min-height: 100%; margin: 0 auto; padding: 40px 24px 48px; position: relative; display: flex; flex-direction: column; align-items: center; }
.logo { margin-bottom: 28px; display: flex; justify-content: center; }
.logo .logo-img { margin-bottom: 14px; height: 110px; width: auto; display: block; }
@media (max-width: 640px) { .logo .logo-img { height: 84px; } }
.back { position: absolute; left: 24px; top: 52px; background: none; border: 0; color: #2e6b33; font-size: 24px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 6px; }
.back svg { width: 14px; height: 20px; }
.kiosk h1 { font-weight: 400; font-size: clamp(26px, 4.4vw, 38px); margin: 0 0 26px; color: #7d858c; text-align: center; }
.prompt { font-size: 18px; margin: 0 0 10px; text-align: center; }
.idwrap { display: grid; grid-template-columns: 170px minmax(0, 400px); gap: 30px; align-items: start; justify-content: center; width: 100%; }
.doc-tabs { display: flex; flex-direction: column; gap: 30px; margin-top: 2px; }
.tab { height: 58px; border-radius: 5px; border: 0; background: #ffffff; color: #7d858c; font-weight: 700; font-size: 15px; box-shadow: 0 2px 10px rgba(0,0,0,.18); cursor: pointer; padding: 0 8px; }
.tab.on { background: #2e6b33; color: #ffffff; }
.tab:not(.on):hover { color: #2e6b33; }
.field { height: 72px; border: 4px solid #2e6b33; background: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: #2e6b33; letter-spacing: .02em; margin-bottom: 12px; overflow: hidden; white-space: nowrap; }
.field .caret { width: 2px; height: 38px; background: #2e6b33; margin-left: 3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0 } }
.pad { display: grid; gap: 4px; }
.pad.num { grid-template-columns: repeat(3, 1fr); }
.pad.num .k { height: 54px; font-size: 26px; }
.pad.alpha { grid-template-columns: repeat(10, 1fr); }
.pad.alpha .k { height: 62px; font-size: 14px; }
.k { border: 0; border-radius: 3px; background: #2e6b33; color: #ffffff; font-weight: 700; cursor: pointer; display: grid; place-items: center; padding: 0; }
.k:active { filter: brightness(.88); }
.k svg { width: 24px; height: 24px; }
.continue { margin-top: 6px; width: 100%; height: 54px; border: 0; border-radius: 3px; background: #2e6b33; color: #ffffff; font-size: 26px; font-weight: 700; cursor: pointer; }
.continue:disabled { background: #a8c9ab; color: #e7e7ea; cursor: default; }
.pad.alpha .continue { margin: 0; height: 62px; font-size: 14px; }
.opt { height: 72px; border: 0; border-radius: 4px; background: #ffffff; box-shadow: 0 2px 10px rgba(0,0,0,.18); color: #2e6b33; font-weight: 700; font-size: 19px; cursor: pointer; padding: 0 6px; line-height: 1.15; }
.opt:hover { outline: 2px solid #2e6b33; outline-offset: -2px; }
.opt:active { transform: translateY(1px); }
.opt.on { background: #2e6b33; color: #ffffff; }
.opt.on:hover { outline: none; }
.opt.cont { background: #2e6b33; color: #ffffff; box-shadow: none; margin-top: 8px; }
.opt.cont:hover { outline: none; filter: brightness(.94); }
.opt.cont:disabled { background: #a8c9ab; color: #e9f1ea; cursor: default; filter: none; }
.opt:disabled:not(.cont) { cursor: default; opacity: .6; }
.list { display: flex; flex-direction: column; gap: 9px; width: min(506px, 100%); margin-top: 48px; }
.list .opt { height: 72px; width: 100%; }
.svc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 250px)); gap: 12px 22px; margin-top: 40px; width: 100%; max-width: 560px; justify-content: center; }
.svc-grid .opt { height: 72px; width: 100%; font-size: 18px; }
.hint { font-size: 17px; color: #9aa0a6; text-align: center; max-width: 540px; margin: -28px 0 20px; line-height: 1.4; }
.ticket { border: 2px dashed #cfcfcf; border-radius: 12px; padding: 22px 40px; text-align: center; margin: 0 auto 28px; background: #ffffff; width: max-content; max-width: min(680px, 92%); }
.ticket .lbl { font-size: 18px; color: #7d858c; }
.ticket .code { font-weight: 700; font-size: clamp(64px, 11vw, 104px); line-height: 1; color: #2e6b33; margin: 8px 0 10px; letter-spacing: .03em; }
.ticket .type { font-size: 18px; font-weight: 500; color: #7d858c; line-height: 1.5; white-space: normal; }
.ticket .flow { font-size: 13px; color: #a2a8ae; font-weight: 400; margin-top: 6px; }
.done { flex: 1; display: grid; place-items: center; min-height: 360px; }
.done p { font-weight: 700; color: #2e6b33; font-size: clamp(28px, 5vw, 42px); text-align: center; line-height: 1.2; margin: 0; }
.study-group { width: 100%; max-width: 560px; margin-top: 22px; }
.study-group h2 { font-size: 17px; font-weight: 500; color: #7d858c; text-align: center; margin: 0 0 10px; }
.study-group .svc-grid { margin-top: 0; max-width: none; }
.preview { width: min(560px, 100%); margin-top: 26px; padding: 14px 18px; border: 2px dashed #cfcfcf; border-radius: 12px; background: #ffffff; text-align: center; }
.preview .lbl { font-size: 14px; color: #a2a8ae; }
.preview .seq { margin-top: 4px; font-size: 18px; font-weight: 500; color: #9aa0a6; line-height: 1.4; }
.preview.ok .seq { color: #2e6b33; font-weight: 700; }
.preview .flow { font-size: 13px; color: #a2a8ae; margin-top: 6px; }
.list.compact { margin-top: 12px; }
.alert { margin-top: 18px; max-width: 506px; width: 100%; padding: 12px 16px; border-radius: 4px; background: #e8f2e8; color: #1f4a23; font-size: 16px; text-align: center; }
.busy { margin-top: 18px; font-size: 17px; color: #9aa0a6; text-align: center; }
.login-form { display: flex; flex-direction: column; gap: 14px; width: min(400px, 100%); }
.login-form label { font-size: 18px; }
.login-form input { height: 58px; border: 4px solid #2e6b33; padding: 0 14px; font-family: inherit; font-size: 22px; font-weight: 700; color: #2e6b33; outline: none; -webkit-user-select: text; user-select: text; }
.logout { position: absolute; right: 24px; top: 52px; background: none; border: 0; color: #a2a8ae; font-size: 15px; cursor: pointer; padding: 6px; }
.k:focus-visible, .tab:focus-visible, .opt:focus-visible, .continue:focus-visible, .back:focus-visible, .logout:focus-visible { outline: 3px solid #7d858c; outline-offset: 2px; }
.screen { animation: in .25s ease-out; width: 100%; display: flex; flex-direction: column; align-items: center; }
/* Como en React: el fundido solo al cambiar de pantalla, no en cada tecla o selección. */
.screen.same { animation: none; }
@keyframes in { from { opacity: 0 } to { opacity: 1 } }
.reprint .opt { width: 100%; }
@media (prefers-reduced-motion: reduce) { .screen, .field .caret { animation: none; } }
@media (max-width: 640px) {
  .idwrap { grid-template-columns: 1fr; }
  .doc-tabs { flex-direction: row; gap: 12px; }
  .tab { flex: 1; }
  .svc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; max-width: 100%; }
  .svc-grid .opt { font-size: 15px; }
  .opt { font-size: 16px; }
  .back { top: 14px; left: 12px; font-size: 18px; }
  .logout { top: 14px; right: 12px; }
  .kiosk { padding-top: 52px; }
}

/* Ticket impreso: mismo mecanismo y medidas que la página real. */
:root { --ticket-width: 72mm; }
@page { size: 80mm auto; margin: 4mm 3mm; }
#print-ticket { position: absolute; left: -9999px; top: 0; width: var(--ticket-width); background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; line-height: 1.25; }
#print-ticket .pt-line { overflow-wrap: anywhere; }
#print-ticket .pt-logo-text { font-size: 18pt; }
@media print {
  html, body { width: 80mm; height: auto !important; overflow: visible !important; background: #fff !important; color: #000 !important; padding: 0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #root { display: none !important; }
  #print-ticket, #print-ticket * { color: #000 !important; border-color: #000 !important; }
  #print-ticket { position: static !important; left: auto !important; top: auto !important; width: var(--ticket-width); }
}
</style>
</head>
<body>

const logo = () => `<div class="logo"><img src="${LOGO_SRC}" alt="Pulso Salud" class="logo-img"></div>`;
const backBtn = () => `<button type="button" class="back" data-act="back">${IconBack}Volver</button>`;

/* ---------- Pantallas ---------- */
function viewLogin() {
  return `<section class="screen">${logo()}
    <h1>Pantalla de Recepción</h1>
    <form class="login-form" id="login-form">
      <label for="user">Usuario</label>
      <input id="user" autocomplete="username">
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password">
      <button type="submit" class="continue" id="login-btn" disabled>Ingresar</button>
    </form>
  </section>`;
}

function viewId() {
  const ced = st.doc === 'cedula';
  const can = validDoc();
  let pad;
  if (ced) {
    pad = `<div class="pad num">${'123456789'.split('').map((n) => `<button type="button" class="k" data-key="${n}">${n}</button>`).join('')}
      <button type="button" class="k" data-act="clear" aria-label="Borrar todo">${IconX}</button>
      <button type="button" class="k" data-key="0">0</button>
      <button type="button" class="k" data-act="del" aria-label="Borrar">${IconDel}</button></div>
      <button type="button" class="continue" data-act="go-id" ${can ? '' : 'disabled'}>Continuar</button>`;
  } else {
    const rows = st.sym ? ['1234567890', '-_/.#&()*+', '!?$%=:;,'] : ['QWERTYUIOP', 'ASDFGHJKLÑ', 'ZXCVBNM'];
    const k1 = (c) => `<button type="button" class="k" data-key="${esc(c)}">${esc(c)}</button>`;
    pad = `<div class="pad alpha">${rows[0].split('').map(k1).join('')}${rows[1].split('').map(k1).join('')}
      <button type="button" class="k" data-act="sym" style="grid-column: span 1">${st.sym ? 'ABC' : '@!#'}</button>
      ${rows[2].split('').map(k1).join('')}
      <button type="button" class="k" data-act="del" aria-label="Borrar" style="grid-column: span ${st.sym ? 1 : 2}">${IconDel}</button>
      <button type="button" class="k" data-act="clear" aria-label="Borrar todo">${IconX}</button>
      ${k1('@')}<button type="button" class="k" data-key=" " aria-label="Espacio" style="grid-column: span 4"></button>${k1('.')}
      <button type="button" class="continue" data-act="go-id" style="grid-column: span 3" ${can ? '' : 'disabled'}>Continuar</button></div>`;
  }
  return `<section class="screen">
    <button type="button" class="logout" data-act="logout">Cerrar sesión</button>
    ${logo()}
    <h1>¡Le damos la bienvenida!</h1>
    <p class="prompt">Por favor ingrese su ${ced ? 'cédula de identidad' : 'pasaporte'}:</p>
    <div class="idwrap">
      <div class="doc-tabs">
        <button type="button" class="tab ${ced ? 'on' : ''}" data-act="doc" data-doc="cedula">Cédula de Identidad</button>
        <button type="button" class="tab ${ced ? '' : 'on'}" data-act="doc" data-doc="pasaporte">Pasaporte</button>
      </div>
      <div><div class="field" aria-live="polite">${esc(st.value)}<span class="caret"></span></div>${pad}</div>
    </div>
  </section>`;
}

function viewServicio() {
  const btns = SERVICES.map((s) => `<button type="button" class="opt" data-act="svc" data-svc="${s.id}" ${busy || combosFor(s).length === 0 ? 'disabled' : ''}>${esc(TX['svc.' + s.id])}</button>`).join('');
  return `<section class="screen">${backBtn()}${logo()}
    <p class="hint">¿Qué servicios se facturaron al paciente?</p>
    <div class="svc-grid">${btns}</div>${feedback()}
  </section>`;
}

function viewEstudios() {
  const svc = SERVICES.find((s) => s.id === st.svc);
  const combos = combosFor(svc);
  const sel = st.sel;
  const match = sel.length ? exactCombo(combos, svc, sel) : undefined;
  const extendable = STUDY_IDS.some((s) => !sel.includes(s) && canAdd(combos, sel, s));
  let status;
  if (!sel.length) status = 'Todavía no elegiste estudios.';
  else if (match) status = comboLabel(match);
  else status = 'Esta combinación no tiene proceso. Sumá o quitá estudios.';

  const groups = GROUPS.map((g) => `<div class="study-group"><h2>${esc(TX['group.' + g])}</h2>
    <div class="svc-grid">${STUDIES.filter((s) => s[1] === g).map(([id]) => {
      const on = sel.includes(id);
      return `<button type="button" class="opt${on ? ' on' : ''}" aria-pressed="${on}" data-act="study" data-study="${id}" ${busy || (!on && !canAdd(combos, sel, id)) ? 'disabled' : ''}>${esc(TX['step.' + id])}</button>`;
    }).join('')}</div></div>`).join('');

  return `<section class="screen">${backBtn()}${logo()}
    <p class="hint">${esc(TX['svc.' + svc.id])}: marcá los estudios facturados y pulsá Continuar.<br>Los que quedan en gris no se pueden combinar con lo ya elegido.</p>
    ${groups}
    <div class="preview${match ? ' ok' : ''}" aria-live="polite">
      <div class="lbl">Proceso a emitir</div>
      <div class="seq">${status}</div>
      ${match ? tipoText(match.tipo) : ''}
      ${match && !extendable && sel.length > 0 ? '<div class="flow">No se pueden sumar más estudios.</div>' : ''}
    </div>
    <div class="list compact"><button type="button" class="opt cont" data-act="finish" ${!match || busy ? 'disabled' : ''}>Continuar</button></div>
    ${feedback()}
  </section>`;
}

function viewTicket() {
  const r = st.result;
  return `<section class="screen">${logo()}
    <div class="done"><div>
      <div class="ticket" role="status">
        <div class="lbl">Su número de turno</div>
        <div class="code">${esc(r.code)}</div>
        <div class="type">${comboLabel(r.combo)}</div>
        ${tipoText(r.combo.tipo)}
      </div>
      <p>El turno ha sido confirmado.<br>Puede entregarle el ticket al paciente.</p>
      <div class="list compact reprint"><button type="button" class="opt" data-act="reprint">Reimprimir ticket</button></div>
    </div></div>
  </section>`;
}

/* ---------- Ticket impreso (plantilla de la pantalla del tótem en debQ) ---------- */
let printEl = null;
let printTimer = null;
function mountPrintTicket(r) {
  unmountPrintTicket();
  const line = (text, size, bold, space) => `<div class="pt-line" style="font-size:${size}pt;font-weight:${bold ? 700 : 400};text-align:center;margin-bottom:${space}px">${text}</div>`;
  printEl = document.createElement('div');
  printEl.id = 'print-ticket';
  printEl.setAttribute('aria-hidden', 'true');
  printEl.innerHTML = [
    `<div class="pt-line" style="text-align:center;margin-bottom:5px"><img src="${LOGO_SRC}" alt="Pulso Salud" style="height:22mm;width:auto"></div>`,
    line('Sucursal OSS Lucerna', 10, false, 5),
    line(esc(r.date), 11, false, 0),
    '<div class="pt-line" style="font-size:10pt;text-align:left;margin-bottom:5px">&nbsp;</div>',
    line(esc(r.code), 20, true, 0),
    line(esc(r.combo.tramite), 10, false, 20),
    line(esc(r.wait), 12, false, 10),
    line('www.pulsosalud.com', 10, true, 5),
    line('numia', 11, false, 0),
    '<div class="pt-line" style="font-size:10pt;text-align:left;margin-bottom:5px">&nbsp;</div>',
  ].join('');
  document.body.appendChild(printEl);
  // Impresión automática al emitir, una sola vez.
  printTimer = setTimeout(() => window.print(), 150);
}
function unmountPrintTicket() {
  clearTimeout(printTimer);
  if (printEl) printEl.remove();
  printEl = null;
}

/* ---------- Vuelta automática (como useIdleReset) ---------- */
let idleTimer = null;
let idleMs = 0;
function armIdle() {
  clearTimeout(idleTimer);
  idleTimer = null;
  if (!logged || (st.screen === 'id' && !st.value.length)) return;
  idleMs = (st.screen === 'done' ? 6 : 45) * 1000;
  idleTimer = setTimeout(reset, idleMs);
}
['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, () => { if (idleTimer) { clearTimeout(idleTimer); idleTimer = setTimeout(reset, idleMs); } }));

/* ---------- Render ---------- */
let lastScreen = null;
let lastHasValue = false;
function render() {
  if (!logged) app.innerHTML = viewLogin();
  else if (st.screen === 'id') app.innerHTML = viewId();
  else if (st.screen === 'servicio') app.innerHTML = viewServicio();
  else if (st.screen === 'estudio') app.innerHTML = viewEstudios();
  else if (st.screen === 'done') app.innerHTML = viewTicket();
  if (st.screen !== 'done' || !logged) unmountPrintTicket();
  const screen = logged ? st.screen : 'login';
  if (screen === lastScreen) app.querySelector('.screen')?.classList.add('same');
  const hasValue = st.value.length > 0;
  if (screen !== lastScreen || hasValue !== lastHasValue) armIdle();
  lastScreen = screen;
  lastHasValue = hasValue;
}

/* ---------- Emisión (respuesta de debQ simulada) ---------- */
function emit(svcId, sel) {
  if (busy) return;
  const svc = SERVICES.find((s) => s.id === svcId);
  const combo = exactCombo(combosFor(svc), svc, sel);
  if (!combo) { error = 'Esa combinación de servicios no tiene un proceso en debQ.'; render(); return; }
  busy = true; error = null;
  st = { ...st, svc: svcId };
  render();
  setTimeout(() => {
    busy = false;
    counter++;
    const now = new Date();
    const p2 = (n) => String(n).padStart(2, '0');
    const date = `${p2(now.getDate())}/${p2(now.getMonth() + 1)}/${now.getFullYear()} ${p2(now.getHours())}:${p2(now.getMinutes())}`;
    const result = { code: (combo.id === 13 ? 'PC' : 'LI') + counter, combo, date, wait: 'Tiempo de espera aproximado: 10 min' };
    go({ svc: svcId, sel, screen: 'done', result });
    mountPrintTicket(result);
  }, 700);
}

/* ---------- Eventos ---------- */
function setValue(v) { if (v.length <= MAX[st.doc]) { st = { ...st, value: v }; render(); } }

app.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b || b.disabled || b.type === 'submit') return;
  if (b.dataset.key !== undefined) return setValue(st.value + b.dataset.key);
  switch (b.dataset.act) {
    case 'del': return setValue(st.value.slice(0, -1));
    case 'clear': return setValue('');
    case 'sym': st = { ...st, sym: !st.sym }; return render();
    case 'doc': st = { ...st, doc: b.dataset.doc, value: '', sym: false }; return render();
    case 'go-id': if (validDoc()) go({ screen: 'servicio' }); return;
    case 'logout': logged = false; reset(); return;
    case 'back': return back();
    case 'svc': {
      const svc = SERVICES.find((s) => s.id === b.dataset.svc);
      if (!svc.images) return emit(svc.id, []);
      return go({ svc: svc.id, sel: [], screen: 'estudio' });
    }
    case 'study': {
      const id = b.dataset.study;
      st = { ...st, sel: st.sel.includes(id) ? st.sel.filter((x) => x !== id) : [...st.sel, id] };
      return render();
    }
    case 'finish': if (st.svc && st.sel.length) emit(st.svc, st.sel); return;
    case 'reprint': return window.print();
  }
});

// Login: el botón se habilita con usuario y contraseña; en el simulador cualquier combinación entra.
app.addEventListener('input', (e) => {
  if (e.target.id !== 'user' && e.target.id !== 'pass') return;
  $('login-btn').disabled = !$('user').value || !$('pass').value;
});
app.addEventListener('submit', (e) => {
  if (e.target.id !== 'login-form') return;
  e.preventDefault();
  if (!$('user').value || !$('pass').value) return;
  logged = true;
  reset();
});

// Teclado físico en Identificación (como el custom).
document.addEventListener('keydown', (e) => {
  if (!logged || st.screen !== 'id') return;
  if (e.key === 'Backspace') return setValue(st.value.slice(0, -1));
  if (e.key === 'Enter' && validDoc()) return go({ screen: 'servicio' });
  const ok = st.doc === 'cedula' ? /^[0-9]$/.test(e.key) : /^[a-zA-ZñÑ0-9@. ]$/.test(e.key);
  if (ok) setValue(st.value + e.key.toUpperCase());
});

render();
})();
</script>
</body>
</html>
